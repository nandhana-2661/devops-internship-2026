global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  # Monitor the local Nginx website
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_200]
    static_configs:
      - targets:
          - http://web:80
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Monitor SSL certificate expiry
  - job_name: 'blackbox-ssl'
    metrics_path: /probe
    params:
      module: [https_ssl]
    static_configs:
      - targets:
          - https://example.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
