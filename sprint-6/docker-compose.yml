services:

  prometheus:
    image: prom/prometheus:latest
    container_name: sprint6-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - blackbox
      - alertmanager

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: sprint6-blackbox
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'

  alertmanager:
    image: prom/alertmanager:latest
    container_name: sprint6-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.local.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'

  web:
    image: nginx:alpine
    container_name: sprint6-web
    ports:
      - "8080:80"
