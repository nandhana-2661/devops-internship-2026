apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprint9-web
  namespace: sprint-9
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sprint9-web
  template:
    metadata:
      labels:
        app: sprint9-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sprint9-web
  namespace: sprint-9
spec:
  selector:
    app: sprint9-web
  ports:
    - port: 80
      targetPort: 80
